name: Build and Push Docker Image (amd64)

on:
  push:
    branches: \[ main \]
    tags: \[ v\* \]
  pull\_request:
    branches: \[ main \]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository\_owner }}
          password: ${{ secrets.GITHUB\_TOKEN }}

      - name: Build & Push amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event\_name != 'pull\_request' }}
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository\_owner }}/openreader:latest
            ghcr.io/${{ github.repository\_owner }}/openreader:amd64
          build-args: |
            BUILD\_DATE=${{ github.event.head\_commit.timestamp }}
            VCS\_REF=${{ github.sha }}
            VERSION=${{ github.ref\_name }}
